<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePassGen — Générateur de mot de passe</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --ok:#4ade80; }
        * { box-sizing: border-box; }
        body {
            margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg); color: var(--text); padding: 16px;
        }
        .card {
            background: var(--card); border-radius: 16px; padding: 28px 32px;
            width: 100%; max-width: 440px; box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }
        h1 { font-size: 1.4rem; margin: 0 0 20px; }
        label.row { display:flex; align-items:center; gap:8px; margin:10px 0; }
        input[type=number] { width: 90px; padding:6px 8px; border-radius:8px; border:1px solid #334155; background:#0b1220; color:var(--text); }
        button {
            margin-top:16px; width:100%; padding:12px; border:0; border-radius:10px;
            background: var(--accent); color:#06283d; font-weight:700; font-size:1rem; cursor:pointer;
        }
        button:hover { filter: brightness(1.08); }
        .result { margin-top:22px; padding:16px; background:#0b1220; border-radius:12px; border:1px solid #334155; }
        .pwd { font-family: ui-monospace, Consolas, monospace; font-size:1.15rem; color:var(--ok); word-break: break-all; }
        .meta { font-size:.9rem; color:#94a3b8; margin-top:8px; }
        .err { color:#f87171; margin-top:16px; }
        .foot { margin-top:18px; font-size:.75rem; color:#64748b; text-align:center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 SecurePassGen</h1>
        <form method="POST">
            <label class="row">Longueur :
                <input type="number" name="longueur" value="12" min="8" max="128">
            </label>
            <label class="row"><input type="checkbox" name="maj" checked> Majuscules</label>
            <label class="row"><input type="checkbox" name="minusc" checked> Minuscules</label>
            <label class="row"><input type="checkbox" name="chiffres" checked> Chiffres</label>
            <label class="row"><input type="checkbox" name="symboles" checked> Symboles</label>
            <button type="submit">Générer</button>
        </form>

        {% if erreur %}
            <p class="err">❌ {{ erreur }}</p>
        {% endif %}

        {% if password %}
            <div class="result">
                <div class="pwd">{{ password }}</div>
                <div class="meta">🔐 Entropie : {{ entropy }} bits &nbsp;·&nbsp; 📊 Force : {{ force }}</div>
            </div>
        {% endif %}

        <p class="foot">Projet éducatif — Suite Cybersécurité · généré avec le module <code>secrets</code></p>
    </div>
</body>
</html>
